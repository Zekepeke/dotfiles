set -g prefix C-s
unbind C-b
bind C-s send-prefix

set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'


set -g focus-events on          # nvim autoread + tmux-navigator need this
set -g renumber-windows on      # no gaps after closing a window
set -g detach-on-destroy off    # killing a session drops you in another, not the shell
set -g set-clipboard on         # OSC 52 — copy works over SSH too
set -g status-position top      # matches where you look for agent status
set -g status-interval 5

set -g allow-rename on
setw -g automatic-rename on
set -g set-titles on
setw -g monitor-activity on
set -g window-status-format " #I:#W#{?window_activity_flag,·,} "



# behavior
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g history-limit 50000
set -g escape-time 0
setw -g mode-keys vi
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
bind r source-file ~/.tmux.conf \; display "Reloaded"

# appearance
set -g status-style bg=default,fg=colour245
set -g status-left "#[fg=colour109,bold] #S "
set -g status-right "#[fg=colour245] %H:%M "
set -g window-status-current-style fg=colour223,bold
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour109


# splits, no prefix needed
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind ';' split-window -h -c "#{pane_current_path}"
bind "'" split-window -v -c "#{pane_current_path}"

# switch panes: Alt + hjkl (no prefix)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# resize panes: Alt + Shift + hjkl (no prefix)
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5


# drag to select, release copies to macOS clipboard
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# double-click a word, triple-click a line
bind -T copy-mode-vi DoubleClick1Pane send -X select-word \; send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi TripleClick1Pane send -X select-line \; send -X copy-pipe-and-cancel "pbcopy"

set -g allow-passthrough on
set -g visual-activity off

# close pane
bind -n M-w kill-pane

# Alt+o: toggle outer tmux off/on (no prefix)
bind -T root M-o \
  set prefix None \; \
  set key-table off \; \
  set status-style "fg=colour238,bg=default" \; \
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \; \
  refresh-client -S

bind -T off M-o \
  set -u prefix \; \
  set -u key-table \; \
  set -u status-style \; \
  refresh-client -S

source-file -q ~/.tmux.local.conf
