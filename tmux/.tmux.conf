set -g prefix C-s
unbind C-b
bind C-s send-prefix

set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# behavior
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g history-limit 50000
set -g escape-time 0
setw -g mode-keys vi
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
bind r source-file ~/.tmux.conf \; display "Reloaded"

# appearance
set -g status-style bg=default,fg=colour245
set -g status-left "#[fg=colour109,bold] #S "
set -g status-right "#[fg=colour245] %H:%M "
set -g window-status-current-style fg=colour223,bold
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour109

# splits, no prefix needed
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind ';' split-window -h -c "#{pane_current_path}"
bind "'" split-window -v -c "#{pane_current_path}"

bind -n M-Left  select-pane -L
bind -n M-Down  select-pane -D
bind -n M-Up    select-pane -U
bind -n M-Right select-pane -R


# drag to select, release copies to macOS clipboard
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# double-click a word, triple-click a line
bind -T copy-mode-vi DoubleClick1Pane send -X select-word \; send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi TripleClick1Pane send -X select-line \; send -X copy-pipe-and-cancel "pbcopy"

set -g allow-passthrough on
set -g visual-activity off

# close pane
bind -n M-w kill-pane